[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104" }
axum = { version = "0.8.9", features = ["macros"] }
dotenvy = "0.15.7"
maud = { version = "0.27.0", features = ["axum"] }
rand = "0.10.3"
rig = { version = "0.45.0" }
schemars = "1.2.3"
serde = "1.0.229"
tokio = { version = "1.54", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
